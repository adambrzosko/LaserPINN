[project]
name = "laser-sim"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "matplotlib",
]

# Apple Metal GPU backend. Versions are pinned because the Metal plugin only
# works against matching jax/jaxlib.  Install with: pip install -e ".[jax]"
[project.optional-dependencies]
jax = [
    "jax==0.11.1",
    "jaxlib==0.11.1",
    "jax-metal==0.1.1",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "gsdfb*", "fiber*", "studies*"]
